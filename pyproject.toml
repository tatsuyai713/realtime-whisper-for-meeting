[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-live-translator"
version = "0.1.0"
description = "Cross-platform live meeting transcription and Japanese translation desktop app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "openai>=2.0",
  "PySide6>=6.7",
  "SoundCard>=0.4.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
local = [
  "faster-whisper>=1.2",
  "mlx-whisper>=0.4.3; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.scripts]
meeting-translator = "meeting_translator.app:main"
meeting-translation-server = "meeting_translator.translation_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_translator = ["*.swift"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
